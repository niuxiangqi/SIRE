- item_id: nr-fadc11c8af1f5d48
  problem: "I\u2019m going to visit San Francisco in July. Can you recommend six activities\
    \ we could do in the city or nearby? Please include an equal amount of indoor\
    \ and outdoor activities. Please specify if we need to purchase tickets or admission\
    \ in advance."
  reference: "Sure! Here are six activities to consider for your July trip to San\
    \ Fran. \nIndoor Options: \n\u2022\tSan Francisco Museum of Modern Art \u2013\
    \ This museum is one of the country's most prominent modern and contemporary art\
    \ museums. Visitors are encouraged to order tickets online but they are also available\
    \ onsite. Check the website for prices and current exhibits. \n\u2022\tCalifornia\
    \ Academy of Sciences \u2013 Try out the California Museum of Sciences, which\
    \ features an aquarium, a living rainforest exhibit, a planetarium, and a natural\
    \ history museum. In addition to being a museum, it is an active research facility\
    \ for conservation research. Tickets can be purchased online or in person.\n\u2022\
    \tExploratorium \u2013 This interactive science museum is located at Pier 15.\
    \ The Exploratorium offers more than 600 hands-on exhibits centered around art,\
    \ human perception, and science. Since entry is subject to availability, ordering\
    \ tickets online before the visit is recommended. \n\nOutdoor Options:\n\u2022\
    \tBike across the Golden Gate Bridge \u2013 This activity gets you up close and\
    \ personal with one of the most iconic attractions in San Francisco. Rent a bike\
    \ from one of the many rental shops near the bridge and enjoy a leisurely ride\
    \ with views of the bridge, the city skyline, and the surrounding nature. \n\u2022\
    \tAlcatraz Island \u2013 Enjoy a ferry ride to the middle of San Francisco Bay,\
    \ home of the former Alcatraz prison, the water tower, and the oldest working\
    \ lighthouse on the West Coast. Tickets sell out quickly, so purchasing tickets\
    \ well before your visit day is advised.\n\u2022\tGolden Gate Park and its gardens\
    \ \u2013 Golden Gate Park is popular among locals and tourists alike. The park\
    \ is famous for its many gardens, including the Japanese Tea Garden and the Conservatory\
    \ of Flowers. It also has many other exciting attractions like the Portals of\
    \ the Past monument, the Koret Children\u2019s Quarter, and the Carousel. It is\
    \ free to walk the park, but some attractions within may require tickets to be\
    \ purchased during the visit. \n\nEnjoy your trip to San Francisco, and for the\
    \ best experience, be sure to check the website for each attraction for the most\
    \ up-to-date information."
  prompt_sha256: fadc11c8af1f5d48832088a600f4492daed0f087b55d6772bc2304f9df2ba4b3
