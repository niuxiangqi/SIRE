- item_id: nr-dd5dbda72441d0c3
  problem: Help me write an email to a customer I just mailed a live SCOBY to about
    how to keep it fresh until they start their kombucha process. It should be conversational
    and concise and any instructions can have bullet points. By the way my company
    name is George's SCOBYs. One last thing, please mention our website (george.com)
    which has many recipes, articles, more tips, and a staff-moderated forum.
  reference: "Hey there! Thank you so much for purchasing from George's SCOBYs. We\
    \ can't wait for you to receive your \"mother!\" Remember that a SCOBY is a live\
    \ bacterial colony, so there are a few things you'll need to do to keep it happy\
    \ when it arrives:\n\n\u2022 If you want to use your SCOBY right away, you can\
    \ immediately brew a batch of kombucha! Head to George.com to find a recipe you'll\
    \ love.\n\u2022 If you're not quite ready to brew some kombucha, pop the SCOBY\
    \ in a Ziploc bag or glass jar with a bit of liquid to cover it and place it in\
    \ the fridge. Your SCOBY will stay nice and fresh for up to 3 months with this\
    \ method.\n\u2022 Let your SCOBY take up residence in a \"SCOBY hotel\" for the\
    \ most long-term storage solution. \n\nYou can always log onto George.com for\
    \ more tips or to use our forum, where many other brewers post and converse in\
    \ our staff-moderated forum! Don't hesitate to reach out with any questions.\n\
    \nCheers,\nGeorge's SCOBYs"
  prompt_sha256: dd5dbda72441d0c3d1a69fed1bae6bcfd475e4cfd1d0b10d56ec3337232b2d01
